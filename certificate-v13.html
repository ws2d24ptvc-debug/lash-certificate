<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120b08">
<title>LASH ACADEMY — Сертификат</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b0705;color:#f3e7de;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;background:radial-gradient(circle at 50% 0,#3a2117 0,transparent 38%),#0b0705}.wrap{width:min(100%,980px);margin:0 auto;padding:16px 12px 34px}.brand{text-align:center;letter-spacing:.28em;font-size:11px;color:#dda47e;margin:4px 0 8px}h1{font-family:Georgia,serif;font-weight:400;text-align:center;font-size:28px;margin:0 0 6px;color:#f3d7c3}.lead{text-align:center;color:#bfa99b;font-size:13px;line-height:1.5;margin:0 auto 18px;max-width:620px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 auto 14px;max-width:760px}label{font-size:12px;color:#caa58f}input{width:100%;margin-top:6px;height:48px;border:1px solid #654233;background:#17100c;color:#fff;border-radius:12px;padding:0 14px;font-size:17px;outline:none}.card{background:#080504;border:1px solid #4a3026;border-radius:16px;padding:8px;box-shadow:0 18px 55px rgba(0,0,0,.35);overflow:hidden}canvas{display:block;width:100%;height:auto;border-radius:10px;background:#1a100c}.actions{margin:14px auto 0;max-width:760px}button{width:100%;min-height:54px;border:0;border-radius:14px;background:#e4a079;color:#1c0f0a;font-size:17px;font-weight:700;padding:0 18px}.note,.status{font-size:11px;color:#9e887b;text-align:center;line-height:1.45;margin:10px auto 0;max-width:680px}.status{color:#d9b9a5;min-height:20px}@media(max-width:620px){.wrap{padding:12px 8px 28px}.form{grid-template-columns:1fr}h1{font-size:24px}.card{padding:5px;border-radius:12px}canvas{border-radius:8px}}
</style>
</head>
<body>
<div class="wrap">
<div class="brand">LASH ACADEMY</div><h1>Ваш сертификат</h1>
<p class="lead">Введите имя и фамилию получателя. Сертификат сразу обновится и его можно будет сохранить на телефон.</p>
<div class="form"><label>Имя<input id="firstName" autocomplete="given-name" placeholder="Имя" maxlength="40"></label><label>Фамилия<input id="lastName" autocomplete="family-name" placeholder="Фамилия" maxlength="50"></label></div>
<div class="card"><canvas id="certificate" width="1491" height="1055"></canvas></div>
<div class="actions"><button id="saveBtn" type="button">Сохранить сертификат</button></div>
<div id="status" class="status"></div>
<p class="note">На iPhone откроется меню «Поделиться». Выберите «Сохранить изображение» или «Сохранить в Файлы».</p>
</div>
<script src="patch0.js?v=13"></script><script src="patch1.js?v=13"></script><script src="patch2.js?v=13"></script><script src="patch3.js?v=13"></script><script src="patch4.js?v=13"></script>
<script>
const W=1491,H=1055;
const PATCH_W=920,PATCH_H=165,PATCH_X=150,PATCH_Y=320;
const c=document.getElementById('certificate'),ctx=c.getContext('2d');
const first=document.getElementById('firstName'),last=document.getElementById('lastName'),statusEl=document.getElementById('status');
const original=new Image(),patch=new Image();
let originalReady=false,patchReady=false;
original.src='EB728164-D014-4352-812A-DEC026E487DA.PNG?v=13';
try{patch.src='data:image/jpeg;base64,'+(window.CERT_PATCH||'')}catch(e){}
const feather=document.createElement('canvas');feather.width=PATCH_W;feather.height=PATCH_H;const fctx=feather.getContext('2d');
function full(){return(first.value.trim()+' '+last.value.trim()).trim()}
function dateRu(){const d=new Date();return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear()}
function fit(text,max,start,min){let s=start;while(s>min){ctx.font=`italic ${s}px "Snell Roundhand","Apple Chancery","Segoe Script","Brush Script MT",Georgia,serif`;if(ctx.measureText(text).width<=max)break;s-=2}return s}
function preparePatch(){
 fctx.clearRect(0,0,PATCH_W,PATCH_H);
 fctx.drawImage(patch,0,0,PATCH_W,PATCH_H,0,0,PATCH_W,PATCH_H);
 fctx.globalCompositeOperation='destination-in';
 let gx=fctx.createLinearGradient(0,0,PATCH_W,0);gx.addColorStop(0,'rgba(0,0,0,0)');gx.addColorStop(.025,'rgba(0,0,0,1)');gx.addColorStop(.94,'rgba(0,0,0,1)');gx.addColorStop(1,'rgba(0,0,0,0)');fctx.fillStyle=gx;fctx.fillRect(0,0,PATCH_W,PATCH_H);
 let gy=fctx.createLinearGradient(0,0,0,PATCH_H);gy.addColorStop(0,'rgba(0,0,0,0)');gy.addColorStop(.06,'rgba(0,0,0,1)');gy.addColorStop(.94,'rgba(0,0,0,1)');gy.addColorStop(1,'rgba(0,0,0,0)');fctx.fillStyle=gy;fctx.fillRect(0,0,PATCH_W,PATCH_H);fctx.globalCompositeOperation='source-over';
}
function draw(){
 if(!originalReady)return;
 ctx.clearRect(0,0,W,H);ctx.drawImage(original,0,0,W,H);
 if(patchReady)ctx.drawImage(feather,PATCH_X,PATCH_Y);
 const n=full();if(n){const s=fit(n,790,84,48);ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`italic ${s}px "Snell Roundhand","Apple Chancery","Segoe Script","Brush Script MT",Georgia,serif`;ctx.fillStyle='#f7e2cf';ctx.shadowColor='rgba(0,0,0,.30)';ctx.shadowBlur=2;ctx.fillText(n,710,410);ctx.restore()}
 ctx.save();ctx.textAlign='center';ctx.font='600 21px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif';ctx.fillStyle='#4b2c20';ctx.fillText(dateRu(),375,915);ctx.restore();
}
original.onload=()=>{originalReady=true;statusEl.textContent='';draw()};
original.onerror=()=>{statusEl.textContent='Не удалось загрузить исходный сертификат.'};
patch.onload=()=>{patchReady=true;preparePatch();statusEl.textContent='';draw()};
patch.onerror=()=>{patchReady=false;draw()};
[first,last].forEach(el=>el.addEventListener('input',draw));
document.getElementById('saveBtn').addEventListener('click',()=>{const n=full();if(!n){statusEl.textContent='Введите имя и фамилию получателя.';first.focus();return}draw();c.toBlob(async blob=>{if(!blob){statusEl.textContent='Не удалось подготовить изображение.';return}const safe=n.replace(/[^a-zA-Zа-яА-ЯёЁ0-9_-]+/g,'-').replace(/^-+|-+$/g,'');const file=new File([blob],`certificate-${safe||'lash-academy'}.png`,{type:'image/png'});try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Сертификат LASH ACADEMY'});statusEl.textContent='Готово.';return}}catch(e){if(e&&e.name==='AbortError'){statusEl.textContent='Сохранение отменено.';return}}const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);statusEl.textContent='Сертификат сохранён.'},'image/png',1)});
</script>
</body></html>
