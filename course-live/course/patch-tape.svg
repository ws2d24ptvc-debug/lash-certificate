<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><rect width="1200" height="700" rx="32" fill="#f7efe9"/><text x="600" y="70" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#2b211d">Изоляция нижних ресниц</text><text x="600" y="112" text-anchor="middle" font-family="Arial" font-size="23" fill="#66554e">Гидрогелевый патч + гладкая пластиковая лента</text><g><ellipse cx="600" cy="300" rx="390" ry="145" fill="#ead5ca"/><path d="M300 295 Q600 150 900 295 Q600 365 300 295" fill="#fffaf7" stroke="#7b6257" stroke-width="5"/><path d="M340 335 Q600 420 860 335 Q800 470 600 480 Q400 470 340 335" fill="#ffffff" stroke="#b77862" stroke-width="5"/><path d="M390 350 Q600 410 810 350" fill="none" stroke="#d59b83" stroke-width="25" stroke-linecap="round"/></g><text x="600" y="525" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#2b211d">1. Сначала патч — закрываем нижние ресницы</text><text x="600" y="565" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#2b211d">2. Сверху гладкая лента — помогает зафиксировать и удобно разделять ресницы</text><rect x="130" y="610" width="940" height="55" rx="18" fill="#ead5ca"/><text x="600" y="646" text-anchor="middle" font-family="Arial" font-size="23" fill="#493b35">Патч и лента не должны заходить на слизистую или причинять дискомфорт</text></svg>