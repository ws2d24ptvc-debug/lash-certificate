<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500"><rect width="1200" height="500" rx="30" fill="#f7efe9"/><text x="600" y="65" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#2b211d">Открытый эффект</text><path d="M100 330 Q600 120 1100 330" fill="none" stroke="#7b6257" stroke-width="5"/><g stroke="#b77862" stroke-width="7" stroke-linecap="round"><path d="M150 310l-8 -65"/><path d="M240 270l-4 -85"/><path d="M330 235l0 -110"/><path d="M420 205l4 -140"/><path d="M510 185l5 -165"/><path d="M600 180l0 -175"/><path d="M690 185l-5 -165"/><path d="M780 205l-4 -140"/><path d="M870 235l0 -110"/><path d="M960 270l4 -85"/><path d="M1050 310l8 -65"/></g><text x="600" y="420" text-anchor="middle" font-family="Arial" font-size="25" fill="#5f514b">Максимальная длина ближе к центру — взгляд визуально раскрывается</text><text x="600" y="458" text-anchor="middle" font-family="Arial" font-size="20" fill="#806e66">Схема показывает принцип, длины подбираются индивидуально</text></svg>