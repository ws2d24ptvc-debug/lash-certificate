<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760"><rect width="1200" height="760" rx="32" fill="#f7efe9"/><text x="600" y="65" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#2b211d">Объёмы 1,5D–3D</text><text x="600" y="105" text-anchor="middle" font-family="Arial" font-size="22" fill="#6b5951">Схема показывает количество искусственных ресниц на соседних натуральных</text><g font-family="Arial" fill="#2b211d"><text x="130" y="190" font-size="32" font-weight="700">1,5D</text><text x="130" y="235" font-size="26">1 / 2 / 1 / 2</text><text x="130" y="330" font-size="32" font-weight="700">2D</text><text x="130" y="375" font-size="26">2 / 2 / 2 / 2</text><text x="130" y="470" font-size="32" font-weight="700">2,5D</text><text x="130" y="515" font-size="26">2 / 3 / 2 / 3</text><text x="130" y="610" font-size="32" font-weight="700">3D</text><text x="130" y="655" font-size="26">3 / 3 / 3 / 3</text></g><g stroke="#b77862" stroke-width="6" stroke-linecap="round"><path d="M520 245v-75 M650 245l-18-75 M650 245l18-75 M780 245v-75 M910 245l-18-75 M910 245l18-75"/><path d="M520 385l-18-75 M520 385l18-75 M650 385l-18-75 M650 385l18-75 M780 385l-18-75 M780 385l18-75 M910 385l-18-75 M910 385l18-75"/><path d="M520 525l-18-75 M520 525l18-75 M650 525l-26-75 M650 525v-80 M650 525l26-75 M780 525l-18-75 M780 525l18-75 M910 525l-26-75 M910 525v-80 M910 525l26-75"/><path d="M520 665l-26-75 M520 665v-80 M520 665l26-75 M650 665l-26-75 M650 665v-80 M650 665l26-75 M780 665l-26-75 M780 665v-80 M780 665l26-75 M910 665l-26-75 M910 665v-80 M910 665l26-75"/></g><g stroke="#7b6257" stroke-width="4"><path d="M485 250h70 M615 250h70 M745 250h70 M875 250h70 M485 390h70 M615 390h70 M745 390h70 M875 390h70 M485 530h70 M615 530h70 M745 530h70 M875 530h70 M485 670h70 M615 670h70 M745 670h70 M875 670h70"/></g><text x="600" y="720" text-anchor="middle" font-family="Arial" font-size="21" fill="#806e66">Это логика распределения объёма, а не схема длины или формы глаза