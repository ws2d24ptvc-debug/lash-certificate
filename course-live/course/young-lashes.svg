<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" rx="32" fill="#f7efe9"/><text x="600" y="68" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#2b211d">Маленькие и молодые ресницы</text><text x="600" y="108" text-anchor="middle" font-family="Arial" font-size="23" fill="#66554e">Не пропускаем автоматически — сначала оцениваем состояние и нагрузку</text><g transform="translate(115 180)"><rect width="440" height="340" rx="26" fill="#fffaf7"/><text x="220" y="52" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#2b211d">Работа с ресницей</text><path d="M70 245 Q220 170 370 245" fill="none" stroke="#7b6257" stroke-width="5"/><g stroke="#2b211d" stroke-width="5" stroke-linecap="round"><path d="M120 225l-20-72"/><path d="M175 205l-8-105"/><path d="M230 198l8-122"/><path d="M285 208l20-92"/><path d="M340 228l25-58"/></g><path d="M120 225l-12-43" stroke="#b77862" stroke-width="7" stroke-linecap="round"/><text x="220" y="290" text-anchor="middle" font-family="Arial" font-size="21" fill="#5f514b">Для слабой или молодой ресницы —</text><text x="220" y="320" text-anchor="middle" font-family="Arial" font-size="21" fill="#5f514b">минимальная подходящая длина и нагрузка</text></g><g transform="translate(645 180)"><rect width="440" height="340" rx="26" fill="#fffaf7"/><text x="220" y="52" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#2b211d">Если ресницу плохо видно</text><path d="M65 220 Q220 135 375 220" fill="none" stroke="#7b6257" stroke-width="6"/><rect x="145" y="105" width="150" height="35" rx="12" fill="#d7a38e" transform="rotate(-5 220 122)"/><path d="M130 215l-20-72 M185 192l-8-95 M240 185l8-108 M295 198l20-86 M350 218l22-58" stroke="#2b211d" stroke-width="5" stroke-linecap="round"/><path d="M220 105v-50" stroke="#b77862" stroke-width="5"/><path d="M205 70l15-18 15 18" fill="none" stroke="#b77862" stroke-width="5"/><text x="220" y="275" text-anchor="middle" font-family="Arial" font-size="21" fill="#5f514b">Небольшая подклейка помогает</text><text x="220" y="305" text-anchor="middle" font-family="Arial" font-size="21" fill="#5f514b">аккуратно изменить положение верхнего века</text></g><rect x="125" y="570" width="950" height="95" rx="22" fill="#ead5ca"/><text x="600" y="610" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#493b35">Глаз остаётся безопасно закрытым, клиенту комфортно.</text><text x="600" y="644" text-anchor="middle" font-family="Arial" font-size="22" fill="#493b35">Подклейка нужна для обзора, а не для сильного натяжения века.</text></svg>