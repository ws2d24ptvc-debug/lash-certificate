<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><rect width="1200" height="700" rx="32" fill="#f7efe9"/><text x="600" y="70" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#2b211d">Освещение рабочего места</text><text x="600" y="112" text-anchor="middle" font-family="Arial" font-size="23" fill="#66554e">Главное — яркий, равномерный свет без резких теней</text><g fill="none" stroke="#b77862" stroke-width="18" stroke-linecap="round"><path d="M170 270h300"/><path d="M245 270v170"/><path d="M730 320 Q900 150 1070 320"/></g><g stroke="#d6a58f" stroke-width="4"><path d="M200 305l-45 90 M260 305l-25 100 M320 305v105 M380 305l25 100 M440 305l45 90"/><path d="M780 330l-40 100 M840 285l-20 130 M900 265v150 M960 285l20 130 M1020 330l40 100"/></g><text x="320" y="500" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#2b211d">Линейная / прямоугольная LED-лампа</text><text x="900" y="500" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#2b211d">Полукруглая лампа-дуга</text><text x="600" y="575" text-anchor="middle" font-family="Arial" font-size="24" fill="#5f514b">Подвижное крепление • регулировка положения • хорошо видно основание ресниц</text><rect x="100" y="615" width="1000" height="55" rx="18" fill="#ead5ca"/><text x="600" y="651" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#493b35">Хороший свет нужен прежде всего для точности и качества работы мастера</text></svg>