<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820"><rect width="1200" height="820" rx="32" fill="#f7efe9"/><text x="600" y="68" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#2b211d">5 основных ошибок начинающего мастера</text><text x="600" y="108" text-anchor="middle" font-family="Arial" font-size="22" fill="#66554e">Проверяй их во время работы и перед завершением процедуры</text><g font-family="Arial"><g transform="translate(80 155)"><rect width="500" height="155" rx="24" fill="#fffaf7"/><circle cx="62" cy="62" r="34" fill="#ead5ca"/><text x="62" y="72" text-anchor="middle" font-size="30" font-weight="700" fill="#9a604c">1</text><text x="120" y="53" font-size="27" font-weight="700" fill="#2b211d">Склейки</text><text x="120" y="88" font-size="20" fill="#5f514b">Соседние натуральные ресницы</text><text x="120" y="116" font-size="20" fill="#5f514b">не должны соединяться между собой.</text></g><g transform="translate(620 155)"><rect width="500" height="155" rx="24" fill="#fffaf7"/><circle cx="62" cy="62" r="34" fill="#ead5ca"/><text x="62" y="72" text-anchor="middle" font-size="30" font-weight="700" fill="#9a604c">2</text><text x="120" y="53" font-size="27" font-weight="700" fill="#2b211d">Слишком много клея</text><text x="120" y="88" font-size="20" fill="#5f514b">Крупная капля утяжеляет основание</text><text x="120" y="116" font-size="20" fill="#5f514b">и повышает риск склеек.</text></g><g transform="translate(80 340)"><rect width="500" height="155" rx="24" fill="#fffaf7"/><circle cx="62" cy="62" r="34" fill="#ead5ca"/><text x="62" y="72" text-anchor="middle" font-size="30" font-weight="700" fill="#9a604c">3</text><text x="120" y="53" font-size="27" font-weight="700" fill="#2b211d">Неправильное направление</text><text x="120" y="88" font-size="20" fill="#5f514b">Ресницы смотрят в разные стороны</text><text x="120" y="116" font-size="20" fill="#5f514b">и ломают общую линию.</text></g><g transform="translate(620 340)"><rect width="500" height="155" rx="24" fill="#fffaf7"/><circle cx="62" cy="62" r="34" fill="#ead5ca"/><text x="62" y="72" text-anchor="middle" font-size="30" font-weight="700" fill="#9a604c">4</text><text x="120" y="53" font-size="27" font-weight="700" fill="#2b211d">Резкие переходы длин</text><text x="120" y="88" font-size="20" fill="#5f514b">Схема выглядит ступенчатой,</text><text x="120" y="116" font-size="20" fill="#5f514b">если переходы не сделаны плавно.</text></g><g transform="translate(350 525)"><rect width="500" height="155" rx="24" fill="#fffaf7"/><circle cx="62" cy="62" r="34" fill="#ead5ca"/><text x="62" y="72" text-anchor="middle" font-size="30" font-weight="700" fill="#9a604c">5</text><text x="120" y="53" font-size="27" font-weight="700" fill="#2b211d">Пропущенные зоны и уголки</text><text x="120" y="88" font-size="20" fill="#5f514b">Даже хороший центр выглядит</text><text x="120" y="116" font-size="20" fill="#5f514b">незавершённо при пустых уголках.</text></g></g><rect x="160" y="725" width="880" height="55" rx="18" fill="#ead5ca"/><text x="600" y="761" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#493b35">Финальный контроль: направление • заполнение • уголки • отсутствие склеек • комфорт клиента</text></svg>