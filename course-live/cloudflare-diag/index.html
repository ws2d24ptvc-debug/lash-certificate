<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка Cloudflare</title><style>body{margin:0;background:#080808;color:#f7eee9;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}.card{max-width:680px;width:100%;border:1px solid #6f4937;border-radius:28px;padding:28px;background:#120e0c}.k{letter-spacing:.18em;text-transform:uppercase;color:#d6a184;font-size:14px}.row{padding:18px 0;border-bottom:1px solid #2f241f}.row:last-child{border-bottom:0}.name{font-weight:700;font-size:22px;margin-bottom:8px}.small{font-size:16px;line-height:1.45;color:#cfc3bd;white-space:pre-wrap;word-break:break-word}.ok{color:#8bd99a}.bad{color:#ff9f9f}.wait{color:#f3c27f}</style></head><body><div class="card"><div class="k">Lash Academy · диагностика</div><div class="row"><div class="name" id="gN">⏳ GET /health</div><div class="small" id="gD">Проверяю…</div></div><div class="row"><div class="name" id="pN">⏳ POST /health</div><div class="small" id="pD">Проверяю…</div></div><div class="row"><div class="name" id="aN">⏳ POST /auth + CORS</div><div class="small" id="aD">Проверяю…</div></div></div><script>const base='https://sparkling-disk-b67d.ws2d24ptvc.workers.dev';async function run(id,url,opt,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);const n=document.getElementById(id+'N'),d=document.getElementById(id+'D');try{const r=await fetch(url,{...opt,signal:c.signal,cache:'no-store'});const txt=await r.text();n.textContent='✅ '+n.textContent.slice(2);n.className='name ok';d.textContent='HTTP '+r.status+'\n'+txt.slice(0,220)}catch(e){n.textContent='❌ '+n.textContent.slice(2);n.className='name bad';d.textContent=(e&&e.name?e.name+': ':'')+(e&&e.message?e.message:String(e))}finally{clearTimeout(t)}};(async()=>{await run('g',base+'/health',{method:'GET'},8000);await run('p',base+'/health',{method:'POST',headers:{'Content-Type':'text/plain'},body:'ping'},8000);await run('a',base+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:'nobody@example.invalid',password:'wrong-password'})},12000)})();</script></body></html>
