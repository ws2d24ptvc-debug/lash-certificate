<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0807" />
  <title>Подтверждение почты — LASH ACADEMY</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 82% 8%,rgba(162,87,52,.18),transparent 34%),radial-gradient(ellipse at 8% 58%,rgba(117,62,39,.13),transparent 38%),linear-gradient(145deg,#080706 0%,#120d0b 52%,#080706 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5e9df}
    .card{width:min(100%,480px);padding:34px 28px;border:1px solid rgba(218,164,123,.28);border-radius:22px;background:rgba(25,18,14,.94);box-shadow:0 24px 80px rgba(0,0,0,.38);text-align:center}
    .brand{font-size:14px;letter-spacing:.18em;color:#e7b68f;margin-bottom:18px}
    h1{font-family:Georgia,serif;font-size:34px;line-height:1.08;margin:0 0 14px;font-weight:500}
    p{font-size:16px;line-height:1.55;color:#cdbbb0;margin:0}
    .spinner{width:42px;height:42px;border:3px solid rgba(231,182,143,.22);border-top-color:#e7b68f;border-radius:50%;margin:26px auto;animation:spin .9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .ok{font-size:46px;margin:10px 0 18px}
    .btn{display:inline-flex;align-items:center;justify-content:center;width:100%;min-height:52px;margin-top:24px;border-radius:14px;background:linear-gradient(90deg,#f0bd8e,#cb7f5d);color:#1a100b;text-decoration:none;font-weight:600;font-size:16px}
    .error{color:#f1b2a8}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">LASH ACADEMY</div>
    <div id="loading">
      <h1>Подтверждаем почту</h1>
      <p>Пожалуйста, подождите несколько секунд.</p>
      <div class="spinner" aria-hidden="true"></div>
    </div>
    <div id="success" hidden>
      <div class="ok">✓</div>
      <h1>Почта подтверждена</h1>
      <p>Регистрация завершена. Теперь можно войти с указанной почтой и паролем.</p>
      <a class="btn" href="/lash-certificate/course-live/auth/?confirmed=1">Перейти ко входу</a>
    </div>
    <div id="failure" hidden>
      <h1>Не удалось подтвердить почту</h1>
      <p class="error" id="errorText">Ссылка недействительна или уже была использована.</p>
      <a class="btn" href="/lash-certificate/course-live/auth/">Вернуться ко входу</a>
    </div>
  </main>
  <script>
    (async function(){
      const BASE='https://lash-course-auth-proxy.layero.app/new';
      const KEY='sb_publishable_4CCOM_y--DyR87goWV3mPQ_givZCJcO';
      const params=new URLSearchParams(location.search);
      const token_hash=params.get('token_hash');
      const type=params.get('type')||'email';
      const loading=document.getElementById('loading');
      const success=document.getElementById('success');
      const failure=document.getElementById('failure');
      const errorText=document.getElementById('errorText');

      function fail(message){
        loading.hidden=true;
        failure.hidden=false;
        if(message) errorText.textContent=message;
      }

      if(!token_hash){
        fail('В ссылке не найден код подтверждения.');
        return;
      }

      try{
        const response=await fetch(BASE+'/auth/v1/verify',{
          method:'POST',
          headers:{
            'apikey':KEY,
            'authorization':'Bearer '+KEY,
            'content-type':'application/json'
          },
          body:JSON.stringify({type,token_hash})
        });

        let data=null;
        try{data=await response.json()}catch{}
        if(!response.ok){
          const message=(data&&((data.msg)||(data.message)||(data.error_description)||(data.error)))||'Ссылка недействительна или уже была использована.';
          fail(message);
          return;
        }

        loading.hidden=true;
        success.hidden=false;
      }catch(err){
        fail('Не удалось связаться с сервером подтверждения. Попробуйте открыть ссылку ещё раз.');
      }
    })();
  </script>
</body>
</html>
