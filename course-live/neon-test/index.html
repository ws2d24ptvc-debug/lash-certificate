<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080706"><title>Проверка Neon</title><style>body{margin:0;background:#080706;color:#f5e9df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(560px,100%);border:1px solid #6d4938;border-radius:24px;padding:28px;background:#140e0b}.eyebrow{letter-spacing:.18em;color:#dba57f;font-size:12px}.status{font-size:28px;line-height:1.2;margin:18px 0}.note{color:#cdbbb0;line-height:1.55}.ok{color:#9bd6a7}.bad{color:#f2a6a6}</style></head><body><main class="card"><div class="eyebrow">LASH ACADEMY · ТЕХНИЧЕСКАЯ ПРОВЕРКА</div><div id="status" class="status">Проверяю новый backend без VPN…</div><div id="note" class="note">Никакие данные аккаунта не используются.</div></main><script>const s=document.getElementById('status'),n=document.getElementById('note');let done=false;const finish=(ok,text,note)=>{if(done)return;done=true;s.textContent=text;s.className='status '+(ok?'ok':'bad');n.textContent=note};const ctl=new AbortController();const timer=setTimeout(()=>{ctl.abort();finish(false,'⏱ Neon не ответил без VPN','Новый домен не ответил за 12 секунд.')},12000);fetch('https://br-purple-bonus-b9gcitpk-lashproxy.compute.c-7.eu-central-1.aws.neon.tech/health',{signal:ctl.signal,cache:'no-store'}).then(async r=>{clearTimeout(timer);const t=await r.text();if(r.ok&&t.trim()==='ok')finish(true,'✅ Neon работает без VPN','Можно переключать обычный вход курса на новый backend.');else finish(false,'❌ Neon ответил с ошибкой','HTTP '+r.status+': '+t.slice(0,120))}).catch(e=>{clearTimeout(timer);if(!done)finish(false,'❌ Neon не подключился',String(e))})</script></body></html>
