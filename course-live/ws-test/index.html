<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080706"><title>Проверка канала</title><style>body{margin:0;background:#080706;color:#f5e9df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(560px,100%);border:1px solid #6d4938;border-radius:24px;padding:28px;background:#140e0b}.eyebrow{letter-spacing:.18em;color:#dba57f;font-size:12px}.status{font-size:28px;line-height:1.2;margin:18px 0}.note{color:#cdbbb0;line-height:1.55}.ok{color:#9bd6a7}.bad{color:#f2a6a6}</style></head><body><main class="card"><div class="eyebrow">LASH ACADEMY · ТЕХНИЧЕСКАЯ ПРОВЕРКА</div><div id="status" class="status">Проверяю защищённый канал…</div><div id="note" class="note">Никакие данные аккаунта не используются.</div></main><script>const s=document.getElementById('status'),n=document.getElementById('note');let done=false;const finish=(ok,text,note)=>{if(done)return;done=true;s.textContent=text;s.className='status '+(ok?'ok':'bad');n.textContent=note};const timer=setTimeout(()=>finish(false,'⏱ Канал не открылся без VPN','WebSocket не ответил за 12 секунд.'),12000);try{const ws=new WebSocket('wss://sparkling-disk-b67d.ws2d24ptvc.workers.dev/rpc');ws.onopen=()=>{s.textContent='Канал открыт. Проверяю ответ…';ws.send(JSON.stringify({type:'ping'}))};ws.onmessage=(e)=>{clearTimeout(timer);if(e.data==='pong')finish(true,'✅ Канал работает без VPN','Можно использовать этот канал для обычного входа в тот же Supabase.');else finish(false,'❌ Worker ответил неожиданно',String(e.data));try{ws.close()}catch{}};ws.onerror=()=>{clearTimeout(timer);finish(false,'❌ WebSocket не подключился','Соединение с Worker через WebSocket не установлено.')}}catch(e){clearTimeout(timer);finish(false,'❌ Ошибка запуска проверки',String(e))}</script></body></html>
