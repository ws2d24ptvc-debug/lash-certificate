<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080706"><title>Проверка соединения</title><style>body{margin:0;background:#080706;color:#f5e9df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(560px,100%);border:1px solid #6d4938;border-radius:24px;padding:28px;background:#140e0b}.eyebrow{letter-spacing:.18em;color:#dba57f;font-size:12px}.status{font-size:28px;line-height:1.2;margin:18px 0}.note{color:#cdbbb0;line-height:1.55}.ok{color:#9bd6a7}.bad{color:#f2a6a6}iframe{width:100%;height:150px;border:1px solid #3c2a22;border-radius:14px;margin-top:18px;background:#fff}</style></head><body><main class="card"><div class="eyebrow">LASH ACADEMY · ТЕХНИЧЕСКАЯ ПРОВЕРКА</div><div id="status" class="status">Проверяю POST без VPN…</div><div class="note">Используются только вымышленные данные. Твой email и пароль не используются.</div><form id="probe" action="https://sparkling-disk-b67d.ws2d24ptvc.workers.dev/auth/v1/token?grant_type=password" method="post" enctype="application/x-www-form-urlencoded" target="result"><input type="hidden" name="email" value="post-probe@example.invalid"><input type="hidden" name="password" value="wrong-password"></form><iframe id="frame" name="result" title="Результат проверки"></iframe></main><script>const s=document.getElementById('status'),f=document.getElementById('frame'),form=document.getElementById('probe');let armed=false,done=false;f.addEventListener('load',()=>{if(!armed||done)return;done=true;s.textContent='✅ Обычный POST проходит без VPN';s.className='status ok'});setTimeout(()=>{armed=true;form.submit()},500);setTimeout(()=>{if(done)return;done=true;s.textContent='⏱ Обычный POST тоже зависает без VPN';s.className='status bad'},10000);</script></body></html>
