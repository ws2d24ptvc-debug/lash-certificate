<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POST тест — LASH ACADEMY</title><style>body{margin:0;background:#0d0908;color:#f5e9df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(88vw,520px);padding:28px;border:1px solid #6f4a38;border-radius:18px;background:#17100d}.status{font-size:24px;margin:16px 0}.small{color:#cdbbb0;line-height:1.5;white-space:pre-wrap;word-break:break-word}button{background:#dba57f;color:#1b100c;border:0;border-radius:10px;padding:14px 18px;font-size:16px;width:100%;margin-top:18px}</style></head><body><div class="box"><div>LASH ACADEMY</div><div class="status" id="s">Проверяю POST через Layero без VPN…</div><div class="small" id="d">Страница открылась. Сейчас проверяю авторизацию через Layero с правильными служебными заголовками.</div><button onclick="location.reload()">Проверить ещё раз</button></div><script>const s=document.getElementById('s'),d=document.getElementById('d');const endpoint='https://lash-course-auth-proxy.layero.app/auth/v1/token?grant_type=password';const headers={'Content-Type':'application/json','apikey':'sb_publishable_3jTxl7e4GIEbzQgPoUiNzw_OIkOax6w','Authorization':'Bearer sb_publishable_3jTxl7e4GIEbzQgPoUiNzw_OIkOax6w','X-Client-Info':'lash-network-test'};const body=JSON.stringify({email:'test@example.invalid',password:'wrong-password'});const req=fetch(endpoint,{method:'POST',mode:'cors',cache:'no-store',headers,body}).then(async r=>({kind:'response',status:r.status,text:await r.text()})).catch(e=>({kind:'error',name:e.name,message:e.message}));const timeout=new Promise(resolve=>setTimeout(()=>resolve({kind:'timeout'}),12000));Promise.race([req,timeout]).then(result=>{if(result.kind==='response'){s.textContent='✅ POST дошёл через Layero. Код '+result.status;d.textContent='Ответ сервера:\n'+result.text.slice(0,800)+'\n\nСделайте скриншот и отправьте Лее.';return}if(result.kind==='error'){s.textContent='❌ POST через Layero не прошёл';d.textContent='Ошибка: '+result.name+' — '+result.message+'\n\nСделайте скриншот и отправьте Лее.';return}s.textContent='⏱ POST через Layero завис без VPN';d.textContent='Страница открывается, но POST-запрос авторизации через Layero не получил ответ за 12 секунд. Сделайте скриншот и отправьте Лее.';});</script></body></html>
