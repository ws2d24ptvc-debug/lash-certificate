<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120b08">
<title>LASH ACADEMY — Сертификат</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0b0705;color:#f3e7de;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 50% 0,#3a2117 0,transparent 38%),#0b0705}
.wrap{width:min(100%,980px);margin:0 auto;padding:18px 12px 36px}
.brand{text-align:center;letter-spacing:.28em;font-size:11px;color:#dda47e;margin:4px 0 8px}
h1{font-family:Georgia,serif;font-weight:400;text-align:center;font-size:28px;margin:0 0 6px;color:#f3d7c3}
.lead{text-align:center;color:#bfa99b;font-size:13px;line-height:1.5;margin:0 auto 18px;max-width:620px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 auto 14px;max-width:760px}
label{font-size:11px;color:#caa58f}
input{width:100%;margin-top:6px;height:48px;border:1px solid #654233;background:#17100c;color:#fff;border-radius:12px;padding:0 14px;font-size:16px;outline:none}
input:focus{border-color:#df9f78;box-shadow:0 0 0 2px rgba(223,159,120,.15)}
.card{background:#080504;border:1px solid #4a3026;border-radius:16px;padding:8px;box-shadow:0 18px 55px rgba(0,0,0,.35);overflow:hidden}
canvas{display:block;width:100%;height:auto;border-radius:10px;background:#1a100c}
.actions{display:grid;grid-template-columns:1fr;gap:10px;margin:14px auto 0;max-width:760px}
button{min-height:52px;border:0;border-radius:14px;background:#e4a079;color:#1c0f0a;font-size:16px;font-weight:700;padding:0 18px;cursor:pointer}
button:active{transform:scale(.99)}
.note{font-size:11px;color:#9e887b;text-align:center;line-height:1.45;margin:10px auto 0;max-width:680px}
.status{min-height:20px;text-align:center;color:#d9b9a5;font-size:12px;margin-top:8px}
@media(max-width:620px){.wrap{padding:12px 8px 28px}.form{grid-template-columns:1fr}h1{font-size:24px}.card{padding:5px;border-radius:12px}canvas{border-radius:8px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">LASH ACADEMY</div>
  <h1>Ваш сертификат</h1>
  <p class="lead">Введите имя и фамилию получателя. Сертификат сразу обновится и его можно будет сохранить на телефон.</p>
  <div class="form">
    <label>Имя<input id="firstName" autocomplete="given-name" placeholder="Имя" maxlength="40"></label>
    <label>Фамилия<input id="lastName" autocomplete="family-name" placeholder="Фамилия" maxlength="50"></label>
  </div>
  <div class="card"><canvas id="certificate" width="1491" height="1055" aria-label="Сертификат LASH ACADEMY"></canvas></div>
  <div class="actions"><button id="saveBtn" type="button">Сохранить сертификат</button></div>
  <div id="status" class="status"></div>
  <p class="note">На iPhone откроется стандартное меню «Поделиться». Выберите «Сохранить изображение» или «Сохранить в Файлы».</p>
</div>
<script>
const canvas=document.getElementById('certificate'),ctx=canvas.getContext('2d');
const firstName=document.getElementById('firstName'),lastName=document.getElementById('lastName');
const saveBtn=document.getElementById('saveBtn'),statusEl=document.getElementById('status');
const img=new Image();
img.src='EB728164-D014-4352-812A-DEC026E487DA.PNG';
function todayRu(){const d=new Date();return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear()}
function fullName(){return (firstName.value.trim()+' '+lastName.value.trim()).trim()}
function fitFont(text,maxWidth,startSize,minSize){let size=startSize;while(size>minSize){ctx.font=`italic ${size}px "Snell Roundhand","Apple Chancery","Segoe Script","Brush Script MT",cursive`;if(ctx.measureText(text).width<=maxWidth)break;size-=2}return size}
function draw(){
  ctx.clearRect(0,0,1491,1055);ctx.drawImage(img,0,0,1491,1055);
  ctx.save();ctx.filter='blur(32px)';ctx.drawImage(img,360,346,790,100,360,346,790,100);ctx.restore();
  const g=ctx.createLinearGradient(360,0,1150,0);g.addColorStop(0,'rgba(45,27,19,.42)');g.addColorStop(.55,'rgba(43,26,19,.50)');g.addColorStop(1,'rgba(61,36,25,.34)');
  ctx.fillStyle=g;ctx.fillRect(360,350,790,96);
  const name=fullName()||'Имя Фамилия',size=fitFont(name,720,78,48);
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`italic ${size}px "Snell Roundhand","Apple Chancery","Segoe Script","Brush Script MT",cursive`;ctx.fillStyle='#f6e1cf';ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=2;ctx.fillText(name,748,405);ctx.shadowBlur=0;
  ctx.font='500 23px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif';ctx.fillStyle='#4b2c20';ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText(todayRu(),365,890);
}
img.onload=draw;img.onerror=()=>{statusEl.textContent='Не удалось загрузить изображение сертификата.'};[firstName,lastName].forEach(el=>el.addEventListener('input',draw));
saveBtn.addEventListener('click',()=>{const name=fullName();if(!name){statusEl.textContent='Введите имя и фамилию получателя.';firstName.focus();return}draw();statusEl.textContent='Подготавливаю сертификат…';canvas.toBlob(async blob=>{if(!blob){statusEl.textContent='Не удалось подготовить изображение.';return}const safe=name.replace(/[^a-zA-Zа-яА-ЯёЁ0-9_-]+/g,'-').replace(/^-+|-+$/g,'');const file=new File([blob],`certificate-${safe||'lash-academy'}.png`,{type:'image/png'});try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Сертификат LASH ACADEMY'});statusEl.textContent='Готово.';return}}catch(e){if(e&&e.name==='AbortError'){statusEl.textContent='Сохранение отменено.';return}}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);statusEl.textContent='Сертификат сохранён.'},'image/png',1)});
</script>
</body>
</html>
