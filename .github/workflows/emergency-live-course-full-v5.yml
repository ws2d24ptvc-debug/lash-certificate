name: Emergency live course full v5

on:
  push:
    paths:
      - '.github/workflows/emergency-live-course-full-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Download full production build
        env:
          FULL_BUILD_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-a998-81f5-8d52-07e3e00a5417/raw?se=2026-10-29T16%3A13%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=1bc0ba31-c0c9-5be7-baba-ed5cbce9ebea&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-29T15%3A27%3A27Z&ske=2026-10-30T15%3A27%3A27Z&sks=b&skv=2026-02-06&sig=MzZylfR7mxaqyVfNYXryHgfFozLhr9NAwZnEGXOVVso%3D"
        run: |
          curl -fL "$FULL_BUILD_URL" -o /tmp/course.zip
          rm -rf /tmp/course
          mkdir -p /tmp/course
          unzip -q /tmp/course.zip -d /tmp/course
          test -f /tmp/course/server/index.mjs

      - name: Remove only the image element in Module 4 lesson 1
        run: |
          python - <<'PY'
          from pathlib import Path
          matches=[]
          for p in Path('/tmp/course/public/assets').glob('lesson._lessonId-*.js'):
              s=p.read_text()
              if 'bezopasnost-sanitariya' in s and 'Модуль ${e}. Урок ${s+1}.' in s:
                  matches.append(p)
          if len(matches) != 1:
              raise SystemExit(f'expected 1 lesson bundle, got {matches}')
          p=matches[0]
          s=p.read_text()
          old='(0,h.jsx)(`img`,{src:c.image,alt:`Модуль ${e}. Урок ${s+1}. ${c.title}`,className:`block h-auto w-full rounded-[18px] border border-[#3c281f] object-contain shadow-2xl`,loading:`eager`})'
          new='e===4&&t===`bezopasnost-sanitariya`?null:(0,h.jsx)(`img`,{src:c.image,alt:`Модуль ${e}. Урок ${s+1}. ${c.title}`,className:`block h-auto w-full rounded-[18px] border border-[#3c281f] object-contain shadow-2xl`,loading:`eager`})'
          if s.count(old) != 1:
              raise SystemExit(f'target markup count={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s)
          Path('/tmp/lesson-asset.txt').write_text(p.name)
          if 'e===4&&t===`bezopasnost-sanitariya`?null:' not in s:
              raise SystemExit('patch marker missing')
          print('patched', p.name)
          PY
          node --check "/tmp/course/public/assets/$(cat /tmp/lesson-asset.txt)"

      - name: Start production site
        run: |
          cd /tmp/course
          PORT=3000 HOST=0.0.0.0 nohup node server/index.mjs >/tmp/course.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/root.html; then exit 0; fi
            sleep 1
          done
          cat /tmp/course.log
          exit 1

      - name: Start public tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --url http://127.0.0.1:3000 --no-autoupdate >/tmp/cloudflared.log 2>&1 &
          for i in {1..60}; do
            URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)
            if [ -n "$URL" ]; then
              echo "$URL" >/tmp/tunnel-url.txt
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cloudflared.log
          exit 1

      - name: Wait for DNS and verify patched live site
        run: |
          URL=$(cat /tmp/tunnel-url.txt)
          OK=0
          for i in {1..60}; do
            if curl -fsSL --connect-timeout 5 "$URL/" -o /tmp/root-public.html; then
              OK=1
              break
            fi
            sleep 2
          done
          test "$OK" = 1
          grep -q 'Наращивание ресниц\|LASH ACADEMY' /tmp/root-public.html
          curl -fsSL --retry 5 "$URL/certificate" -o /tmp/certificate-public.html
          grep -q 'Сертификат\|certificate' /tmp/certificate-public.html
          curl -fsSI --retry 5 "$URL/Wewww.PNG" | grep -q '200'
          ASSET=$(cat /tmp/lesson-asset.txt)
          curl -fsSL --retry 5 "$URL/assets/$ASSET" -o /tmp/live-lesson.js
          grep -Fq 'e===4&&t===`bezopasnost-sanitariya`?null:' /tmp/live-lesson.js

      - name: Publish stable bridge
        run: |
          URL=$(cat /tmp/tunnel-url.txt)
          mkdir -p live
          printf '%s\n' "$URL" > live/url.txt
          printf 'root=200\ncertificate=200\nphotos=200\nmodule4_lesson1_image_element=removed\n' > live/verify.txt
          cat > live/index.html <<EOF
          <!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lash Academy</title><meta http-equiv="refresh" content="0;url=$URL/"><script>location.replace('$URL/'+location.search+location.hash)</script></head><body style="margin:0;background:#0d0907;color:#f3e5dc;font-family:system-ui;display:grid;place-items:center;min-height:100vh"><p>Открываем курс…</p></body></html>
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live
          git diff --cached --quiet || git commit -m "Remove broken Module 4 lesson 1 image element"
          git push

      - name: Keep fixed site online
        run: |
          echo "Fixed site live at $(cat /tmp/tunnel-url.txt)"
          sleep 20000
