name: Switch auth page to new backend

on:
  push:
    paths:
      - '.github/workflows/switch-auth-to-new-backend.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch auth page for new no-VPN backend
        shell: bash
        run: |
          cat > course-live/assets/new-backend-fetch-20261031.js <<'JS'
          (function(){
            const BASE='https://br-purple-bonus-b9gcitpk-lashproxy2.compute.c-7.eu-central-1.aws.neon.tech';
            const KEY='sb_publishable_4CCOM_y--DyR87goWV3mPQ_givZCJcO';
            const nativeFetch=window.fetch.bind(window);
            function authenticatedJwt(token){
              try{
                if(!token||token.split('.').length!==3)return false;
                const s=token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
                const p=JSON.parse(atob(s.padEnd(Math.ceil(s.length/4)*4,'=')));
                return p&&p.role==='authenticated';
              }catch{return false}
            }
            window.fetch=async function(input,init){
              const opts=init?{...init}:{};
              let raw;
              try{raw=input instanceof Request?input.url:String(input)}catch{return nativeFetch(input,init)}
              let u;
              try{u=new URL(raw,location.href)}catch{return nativeFetch(input,init)}
              if(!/^\/(auth|rest|storage|functions)\/v1(?:\/|$)/.test(u.pathname))return nativeFetch(input,init);
              const target=BASE+u.pathname+u.search;
              const headers=new Headers(input instanceof Request?input.headers:undefined);
              if(opts.headers)new Headers(opts.headers).forEach((v,k)=>headers.set(k,v));
              headers.set('apikey',KEY);
              const auth=headers.get('authorization');
              const token=auth&&auth.replace(/^Bearer\s+/i,'');
              if(!authenticatedJwt(token))headers.set('authorization','Bearer '+KEY);
              opts.headers=headers;
              if(input instanceof Request){
                opts.method=opts.method||input.method;
                if(!('body' in opts)&&!['GET','HEAD'].includes(opts.method.toUpperCase())){
                  try{opts.body=await input.clone().arrayBuffer()}catch{}
                }
              }
              return nativeFetch(target,opts);
            };
            window.__LASH_NEW_BACKEND__=true;
          })();
          JS
          python3 - <<'PY'
          from pathlib import Path
          p=Path('course-live/auth/index.html')
          s=p.read_text()
          tag='<script src="/lash-certificate/course-live/assets/new-backend-fetch-20261031.js?v=1"></script>'
          if tag not in s:
              marker='<script type="module" async="" src="/lash-certificate/course-live/assets/index-routing-20261031-v3-studentfix5.js"></script>'
              if marker not in s:
                  raise SystemExit('module marker not found')
              s=s.replace(marker,tag+marker,1)
              p.write_text(s)
          PY
      - name: Commit live auth switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course-live/auth/index.html course-live/assets/new-backend-fetch-20261031.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Route auth page through new no-VPN backend"
          git push
