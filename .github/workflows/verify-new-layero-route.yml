name: Verify new Layero backend route

on:
  push:
    paths:
      - '.github/workflows/verify-new-layero-route.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Layero dual proxy
        env:
          PROXY: https://lash-course-auth-proxy.layero.app
          KEY: sb_publishable_4CCOM_y--DyR87goWV3mPQ_givZCJcO
        run: |
          mkdir -p course-live/diagnostics
          ok=0
          for i in $(seq 1 30); do
            health=$(curl -fsS --connect-timeout 5 --max-time 15 "$PROXY/health" 2>/dev/null || true)
            if [ "$health" = "ok-cors5-dual" ]; then ok=1; break; fi
            sleep 4
          done
          echo "health=$health" > course-live/diagnostics/new-layero-route.txt
          if [ "$ok" != "1" ]; then
            echo "new_route_deployed=false" >> course-live/diagnostics/new-layero-route.txt
            cat course-live/diagnostics/new-layero-route.txt
            exit 1
          fi
          code=$(curl -sS -o /tmp/settings -w '%{http_code}' --connect-timeout 5 --max-time 20 -H "apikey: $KEY" "$PROXY/new/auth/v1/settings" || true)
          echo "settings_http=$code" >> course-live/diagnostics/new-layero-route.txt
          cat /tmp/settings >> course-live/diagnostics/new-layero-route.txt || true
          test "$code" = "200"
      - name: Commit verification
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course-live/diagnostics/new-layero-route.txt || true
          git commit -m 'Record new Layero route verification' || exit 0
          git push
