name: Emergency live course - hide Module 4 broken photo

on:
  push:
    paths:
      - '.github/workflows/emergency-live-course-module4-photo-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Download verified full production build
        env:
          FULL_BUILD_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-f73c-81f5-84cf-3f65e10125ca/raw?se=2026-10-29T15%3A30%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=da58d723-de93-5fa2-89f8-e3a493ea63d9&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-29T15%3A08%3A28Z&ske=2026-10-30T15%3A08%3A28Z&sks=b&skv=2026-02-06&sig=0zO%2BKO5UtHEJkB4NOXtSGiJEfii2PF6Ctg%2B9I/SgP6Q%3D"
        run: |
          curl -fL "$FULL_BUILD_URL" -o /tmp/course.zip
          mkdir -p /tmp/course
          unzip -q /tmp/course.zip -d /tmp/course
          test -f /tmp/course/server/index.mjs
      - name: Remove only the broken image from Module 4 lesson 1
        run: |
          python - <<'PY'
          from pathlib import Path

          client = next(Path('/tmp/course/public/assets').glob('lesson._lessonId-*.js'))
          s = client.read_text()
          old_img = 'image:`/%D0%93%D1%80%D0%B0%D0%BC%D0%BC%20.PNG`'
          if old_img not in s:
              raise SystemExit('client Module 4 image reference not found')
          s = s.replace(old_img, 'image:null', 1)
          old_render = '(0,h.jsx)(`img`,{src:c.image,alt:`Модуль ${e}. Урок ${s+1}. ${c.title}`,className:`block h-auto w-full rounded-[18px] border border-[#3c281f] object-contain shadow-2xl`,loading:`eager`})'
          if old_render not in s:
              raise SystemExit('client image renderer not found')
          s = s.replace(old_render, 'c.image?(0,h.jsx)(`img`,{src:c.image,alt:`Модуль ${e}. Урок ${s+1}. ${c.title}`,className:`block h-auto w-full rounded-[18px] border border-[#3c281f] object-contain shadow-2xl`,loading:`eager`}):null', 1)
          client.write_text(s)

          server = next(Path('/tmp/course/server/_ssr').glob('lesson._lessonId-*.mjs'))
          s = server.read_text()
          old_img = 'image: "/%D0%93%D1%80%D0%B0%D0%BC%D0%BC%20.PNG"'
          if old_img not in s:
              raise SystemExit('server Module 4 image reference not found')
          s = s.replace(old_img, 'image: null', 1)
          old_render = '''/* @__PURE__ */ (0, import_jsx_runtime.jsx)("img", {
\t\t\t\t\tsrc: item.image,
\t\t\t\t\talt: `Модуль ${moduleNumber}. Урок ${current + 1}. ${item.title}`,
\t\t\t\t\tclassName: "block h-auto w-full rounded-[18px] border border-[#3c281f] object-contain shadow-2xl",
\t\t\t\t\tloading: "eager"
\t\t\t\t})'''
          if old_render not in s:
              raise SystemExit('server image renderer not found')
          s = s.replace(old_render, 'item.image ? ' + old_render + ' : null', 1)
          server.write_text(s)
          PY
      - name: Start patched production site
        run: |
          cd /tmp/course
          PORT=3000 HOST=0.0.0.0 nohup node server/index.mjs >/tmp/course.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/root.html; then exit 0; fi
            sleep 1
          done
          cat /tmp/course.log
          exit 1
      - name: Start secure public tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --url http://127.0.0.1:3000 --no-autoupdate >/tmp/cloudflared.log 2>&1 &
          for i in {1..60}; do
            URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)
            if [ -n "$URL" ]; then
              echo "$URL" >/tmp/tunnel-url.txt
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cloudflared.log
          exit 1
      - name: Verify site and Module 4 fix
        run: |
          URL=$(cat /tmp/tunnel-url.txt)
          curl -fsSL --retry 5 --retry-delay 2 "$URL/" -o /tmp/root-public.html
          grep -q 'Наращивание ресниц\|LASH ACADEMY' /tmp/root-public.html
          curl -fsSL --retry 5 "$URL/certificate" -o /tmp/certificate-public.html
          grep -q 'Сертификат\|certificate' /tmp/certificate-public.html
          curl -fsSI --retry 5 "$URL/Wewww.PNG" | grep -q '200'
          ! grep -q '/%D0%93%D1%80%D0%B0%D0%BC%D0%BC%20.PNG' /tmp/course/public/assets/lesson._lessonId-*.js
      - name: Publish updated stable bridge
        run: |
          URL=$(cat /tmp/tunnel-url.txt)
          mkdir -p live
          printf '%s\n' "$URL" > live/url.txt
          printf 'root=200\ncertificate=200\nphotos=200\nmodule4_lesson1_broken_photo=hidden\n' > live/verify.txt
          cat > live/index.html <<EOF
          <!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lash Academy</title><meta http-equiv="refresh" content="0;url=$URL/"><script>location.replace('$URL/'+location.search+location.hash)</script></head><body style="margin:0;background:#0d0907;color:#f3e5dc;font-family:system-ui;display:grid;place-items:center;min-height:100vh"><p>Открываем курс…</p></body></html>
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live
          git diff --cached --quiet || git commit -m "Hide broken photo in Module 4 lesson 1"
          git push
      - name: Keep fixed site online for today
        run: |
          echo "Fixed site live at $(cat /tmp/tunnel-url.txt)"
          sleep 20000
