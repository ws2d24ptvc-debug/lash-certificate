name: Diagnose emergency live course

on:
  push:
    paths:
      - '.github/workflows/diagnose-emergency-live.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose public tunnel
        run: |
          set +e
          URL=$(cat live/url.txt)
          ROOT_CODE=$(curl -sS -L --max-time 30 -o /tmp/root.html -w '%{http_code}' "$URL/")
          ROOT_MATCH=no
          grep -q 'Наращивание ресниц\|LASH ACADEMY' /tmp/root.html && ROOT_MATCH=yes
          ASSET=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/root.html | head -1)
          if [ -n "$ASSET" ]; then ASSET_CODE=$(curl -sS -I -L --max-time 30 -o /dev/null -w '%{http_code}' "$URL$ASSET"); else ASSET_CODE=missing; fi
          IMAGE_CODE=$(curl -sS -I -L --max-time 60 -o /dev/null -w '%{http_code}' "$URL/Wewww.PNG")
          CERT_CODE=$(curl -sS -L --max-time 30 -o /tmp/cert.html -w '%{http_code}' "$URL/certificate")
          CERT_MATCH=no
          grep -q 'Сертификат\|certificate' /tmp/cert.html && CERT_MATCH=yes
          printf 'url=%s\nroot_code=%s\nroot_match=%s\nasset=%s\nasset_code=%s\nimage_code=%s\ncertificate_code=%s\ncertificate_match=%s\n' "$URL" "$ROOT_CODE" "$ROOT_MATCH" "$ASSET" "$ASSET_CODE" "$IMAGE_CODE" "$CERT_CODE" "$CERT_MATCH" > live/verify.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/verify.txt
          git commit -m "Record emergency live verification" || true
          git push
