name: Verify fixed student cabinet in browser

on:
  push:
    paths:
      - '.github/workflows/verify-student-cabinet-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Serve Pages copy
        run: |
          mkdir -p /tmp/site/lash-certificate
          cp -R course-live /tmp/site/lash-certificate/course-live
          nohup python3 -m http.server 8123 --directory /tmp/site >/tmp/http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8123/lash-certificate/course-live/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Verify pending and active student
        run: |
          node scripts/diagnose-student-cabinet-browser.mjs
          cat course-live/diagnostics/cabinet-browser.txt
          ! grep -q "This page didn't load" course-live/diagnostics/cabinet-browser.txt
          ! grep -q "useEffect) is not a function" course-live/diagnostics/cabinet-browser.txt
          grep -q 'CASE=pending-student' course-live/diagnostics/cabinet-browser.txt
          grep -q 'CASE=active-student' course-live/diagnostics/cabinet-browser.txt
