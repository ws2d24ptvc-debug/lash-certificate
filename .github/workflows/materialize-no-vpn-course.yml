name: Materialize no-VPN full course

on:
  push:
    paths:
      - '.github/workflows/materialize-no-vpn-course.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages repository
        uses: actions/checkout@v4

      - name: Restore successful full no-VPN Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "12923528582"
        run: |
          rm -rf /tmp/pages-artifact /tmp/full-site course-live
          mkdir -p /tmp/pages-artifact /tmp/full-site
          curl -fL --retry 5 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/pages.zip
          unzip -q /tmp/pages.zip -d /tmp/pages-artifact
          ARCHIVE=$(find /tmp/pages-artifact -type f \( -name '*.tar' -o -name '*.tar.gz' -o -name '*.tgz' \) | head -1)
          test -n "$ARCHIVE"
          if file "$ARCHIVE" | grep -qi gzip; then
            tar -xzf "$ARCHIVE" -C /tmp/full-site
          else
            tar -xf "$ARCHIVE" -C /tmp/full-site
          fi
          test -s /tmp/full-site/course-live/index.html
          test -f /tmp/full-site/course-live/C422E4CE-6585-453F-B280-676D04845B9F.PNG
          test -f /tmp/full-site/course-live/C1E03794-5EB4-4FC3-AD6A-21795907586B.PNG
          ! grep -Rqs 'trycloudflare.com' /tmp/full-site/course-live || { echo 'Tunnel reference found'; exit 1; }
          cp -a /tmp/full-site/course-live ./course-live
          touch .nojekyll
          cat > live/index.html <<'EOF'
          <!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lash Academy</title><meta http-equiv="refresh" content="0;url=https://ws2d24ptvc-debug.github.io/lash-certificate/course-live/"><script>location.replace('https://ws2d24ptvc-debug.github.io/lash-certificate/course-live/'+location.search+location.hash)</script></head><body style="margin:0;background:#0d0907;color:#f3e5dc;font-family:system-ui;display:grid;place-items:center;min-height:100vh"><p>Открываем курс…</p></body></html>
          EOF

      - name: Save full course permanently in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A course-live live/index.html .nojekyll
          git diff --cached --quiet && exit 0
          git commit -m "Persist full no-VPN course on GitHub Pages"
          git push
