name: Sync course export

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-course-export.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download encrypted course export
        env:
          EXPORT_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-f4cc-81f5-b549-4c70bb9efecc/raw?se=2026-10-29T14%3A56%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=766cd973-d3a5-5e70-9b70-bb23c57fb314&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-29T13%3A03%3A17Z&ske=2026-10-30T13%3A03%3A17Z&sks=b&skv=2026-02-06&sig=v0us7LYu53FzdfRiVPPM1mN1gYDVrBa5lZmnqEMiREo%3D'
        run: |
          curl -fL "$EXPORT_URL" -o /tmp/course-export.zip
          rm -rf /tmp/course-export
          mkdir -p /tmp/course-export
          unzip -q /tmp/course-export.zip -d /tmp/course-export
          python - <<'PY'
          import json
          e=json.load(open('/tmp/course-export/content.enc.json'))
          assert e['algorithm'] == 'AES-GCM' and len(e['data']) > 1000
          print('encrypted course export verified')
          PY
      - name: Upload encrypted content through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json
          raw=open('/tmp/course-export/content.enc.json','rb').read()
          payload={'message':'Sync encrypted course content','content':base64.b64encode(raw).decode(),'branch':'main'}
          open('/tmp/content-payload.json','w').write(json.dumps(payload))
          PY
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/course/content.enc.json" --input /tmp/content-payload.json
