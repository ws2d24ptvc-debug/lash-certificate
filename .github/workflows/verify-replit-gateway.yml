name: Verify no-VPN auth gateway

on:
  push:
    paths:
      - '.github/workflows/verify-replit-gateway.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check gateway health and Supabase relay
        env:
          GATEWAY: https://gargantuan-odd-objectmodel--6nmzk9jh2r.replit.app
          APIKEY: sb_publishable_3jTxl7e4GIEbzQgPoUiNzw_OIkOax6w
          ORIGIN: https://ws2d24ptvc-debug.github.io
        run: |
          set -euxo pipefail
          root_code=$(curl -sS -o /tmp/root -w '%{http_code}' --max-time 20 "$GATEWAY/")
          health_code=$(curl -sS -o /tmp/health -w '%{http_code}' --max-time 20 "$GATEWAY/health" || true)
          options_headers=$(curl -sS -i -X OPTIONS --max-time 20 \
            -H "Origin: $ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: apikey,authorization,content-type' \
            "$GATEWAY/auth/v1/token?grant_type=password" || true)
          post_code=$(curl -sS -o /tmp/post -w '%{http_code}' --max-time 20 \
            -X POST \
            -H "Origin: $ORIGIN" \
            -H "apikey: $APIKEY" \
            -H 'Content-Type: application/json' \
            --data '{"email":"gateway-probe@example.invalid","password":"not-a-real-password"}' \
            "$GATEWAY/auth/v1/token?grant_type=password" || true)
          echo "root=$root_code"
          echo "health=$health_code"
          echo "post=$post_code"
          echo "$options_headers" | sed -n '1,25p'
          cat /tmp/health || true
          cat /tmp/post || true
          test "$root_code" != "000"
          test "$post_code" != "000"
          test "$post_code" != "404"
          test "$post_code" != "500"
          echo "$options_headers" | grep -qi 'access-control-allow-origin'
