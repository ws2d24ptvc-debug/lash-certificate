name: Switch course-live to VPN-free proxy

on:
  push:
    paths:
      - '.github/workflows/switch-course-live-supabase-novpn.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  OLD_URL: 'https://sparkling-disk-b67d.ws2d24ptvc.workers.dev'
  NEW_URL: 'https://br-purple-bonus-b9gcitpk-lashproxy.compute.c-7.eu-central-1.aws.neon.tech'

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Neon backend
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/health.txt -w '%{http_code}' "$NEW_URL/health")
          echo "neon_health_http=$code"
          cat /tmp/health.txt
          test "$code" = "200"
          grep -qx 'ok' /tmp/health.txt

      - name: Switch current GitHub Pages build to Neon
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          old=os.environ['OLD_URL']; new=os.environ['NEW_URL']; root=Path('course-live'); changed=[]
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.js','.html','.json','.txt','.css'}: continue
              try: text=path.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              if old in text:
                  n=text.count(old); path.write_text(text.replace(old,new),encoding='utf-8'); changed.append((str(path),n))
          if not changed: raise SystemExit('Cloudflare proxy URL not found; refusing blind patch')
          for path,n in changed: print(f'replaced {n} occurrence(s) in {path}')
          leftovers=[]
          for path in root.rglob('*'):
              if path.is_file() and path.suffix.lower() in {'.js','.html','.json','.txt','.css'}:
                  try:
                      if old in path.read_text(encoding='utf-8'): leftovers.append(str(path))
                  except UnicodeDecodeError: pass
          if leftovers: raise SystemExit('Cloudflare proxy endpoint remains: '+', '.join(leftovers))
          PY

      - name: Commit Neon-backed course build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course-live
          if git diff --cached --quiet; then
            echo 'No build changes to commit'
          else
            git commit -m 'Use Neon backend for course build'
            git push
          fi
