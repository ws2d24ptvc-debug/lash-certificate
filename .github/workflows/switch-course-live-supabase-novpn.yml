name: Switch course-live to VPN-free proxy

on:
  push:
    paths:
      - '.github/workflows/switch-course-live-supabase-novpn.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  OLD_URL: 'https://ytolxddmtybtatadhyqj.supabase.co'
  NEW_URL: 'https://gargantuan-odd-objectmodel--6nmzk9jh2r.replit.app'
  SUPABASE_KEY: 'sb_publishable_3jTxl7e4GIEbzQgPoUiNzw_OIkOax6w'

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify proxy auth endpoint
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/settings.json -w '%{http_code}' \
            -H "apikey: $SUPABASE_KEY" \
            "$NEW_URL/auth/v1/settings")
          echo "proxy_settings_http=$code"
          test "$code" = "200"

      - name: Switch current GitHub Pages build to proxy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          old=os.environ['OLD_URL']; new=os.environ['NEW_URL']; root=Path('course-live'); changed=[]
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.js','.html','.json','.txt','.css'}: continue
              try: text=path.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              if old in text:
                  n=text.count(old); path.write_text(text.replace(old,new),encoding='utf-8'); changed.append((str(path),n))
          if not changed: raise SystemExit('Direct Supabase URL not found; refusing blind patch')
          for path,n in changed: print(f'replaced {n} occurrence(s) in {path}')
          leftovers=[]
          for path in root.rglob('*'):
              if path.is_file() and path.suffix.lower() in {'.js','.html','.json','.txt','.css'}:
                  try:
                      if old in path.read_text(encoding='utf-8'): leftovers.append(str(path))
                  except UnicodeDecodeError: pass
          if leftovers: raise SystemExit('Direct Supabase endpoint remains: '+', '.join(leftovers))
          PY

      - name: Commit VPN-free proxy build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course-live
          if git diff --cached --quiet; then
            echo 'No build changes to commit'
          else
            git commit -m 'Use VPN-free auth proxy in course build'
            git push
          fi
