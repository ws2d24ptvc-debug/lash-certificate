name: Add emergency static no-VPN access

on:
  push:
    paths:
      - '.github/workflows/add-emergency-static-access.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch direct course for hidden offline access
        run: python .github/scripts/add_emergency_static_access.py
      - name: Commit patched course
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course/app.js course/index.html
          git commit -m "Add hidden static course mode for no-VPN access" || exit 0
          git push
